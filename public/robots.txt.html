
<head>
<title>1MB / Error</title>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, user-scalable=no'>
<meta name='theme-color' content='#f2f2f2'>
<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap'); 
body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background-color: #f2f2f2;
    font-family: 'Quicksand', sans-serif; 
    -webkit-text-size-adjust: 100%;
    padding-left: 40px;
    padding-right: 40px;

  }
  
  .error-container {
    width: 100%;
    max-height: 80%;
    background-color: #ffffff;
    border: 1px solid #ccc;
    border-radius: 5px;
    text-align: center;
    padding: 40px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    overflow: auto;
    animation: growFadeBounce 1s ease-in-out;
  }

  .error-container a {
    text-decoration: none;
    color: #254cf5;
}
  
  h1 {
    font-size: 30px;
    margin-bottom: 20px;
    margin-top: 0px;
  }
  
  p {
    font-size: 20px;
    color: #666666;
    margin-top: 0px;
    margin-bottom: 0px;
  }

  @keyframes growFadeBounce {
    0% {
      transform: scale(0);
      opacity: 0;
    }
    50% {
      transform: scale(1.2);
      opacity: 1;
    }
    70% {
      transform: scale(0.8);
    }
    100% {
      transform: scale(1);
    }
  }
</style>
</head><div class="error-container"><h1>Error</h1><p>This file doesn't exist. Create a 404.html file to display a custom error here.</p></div>
