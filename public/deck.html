<!DOCTYPE html>
<html lang="en">
<!--
  deck.html: a virtual Stream Deck in its own window, opened by the timer's deck editor (Use as virtual
  deck…): for a touch screen beside the timer, or to try a layout. Its keys are the timer window's
  (window.opener.StreamDeck: faces(model, {editing, local}) and press()), drawn by virtual-deck.js as the
  phone remote's deck view is. While the deck editor is open they're its unsaved settings, so a layout can
  be tried before Save. ?model=xl | mk2 | mini (the size menu changes it). It talks only to the timer
  window that opened it (and to that window again after it reloads).
  MIT Licensed
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Stream Deck</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ccc; font: 13px "Helvetica Neue", Arial, sans-serif; overflow: hidden; user-select: none; }
    .top { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #0b0b0b; border-bottom: 1px solid #222; height: 26px; }
    .top select { font: inherit; background: #1a1a1a; color: #ddd; border: 1px solid #333; border-radius: 4px; padding: 2px 4px; }
    #note { flex: 1; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #note.edit { color: #ffcc33; }
    #note.gone { color: #ff8a8a; }
    #deck { position: fixed; top: 39px; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box; }
    #keys { display: grid; grid-template-columns: repeat(var(--cols, 8), var(--key, 40px)); grid-auto-rows: var(--key, 40px);
      column-gap: var(--col-gap, 6px); row-gap: var(--row-gap, 6px); filter: brightness(var(--deck-bl, 1)); transition: filter .3s; touch-action: none; }
    #keys canvas { width: var(--key, 40px); height: var(--key, 40px); border-radius: 14%; display: block; cursor: pointer; transition: transform .06s; }
    #keys canvas.down { transform: scale(0.92); }
    #keys canvas.idle { cursor: default; }
    #keys canvas.off { opacity: .3; }
    #more { font: inherit; color: #aaa; background: none; border: 1px solid #333; border-radius: 4px; padding: 1px 8px; cursor: pointer; }
    #menu { position: fixed; top: 34px; right: 8px; z-index: 5; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
    #menu button { display: block; width: 100%; text-align: left; font: inherit; color: #ddd; background: none; border: 0; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    #menu button:hover { background: #262626; }
    #share { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; }
    #share .box { background: #151515; border: 1px solid #333; border-radius: 10px; padding: 16px 18px; max-width: 360px; text-align: center; }
    #share h3 { margin: 0 0 6px; color: #fff; font-size: 15px; }
    #share p { margin: 6px 0; color: #aaa; line-height: 1.4; }
    #qr { background: #fff; padding: 10px; border-radius: 6px; display: inline-block; margin: 6px 0; line-height: 0; }
    #s-wait { margin-top: 8px; }
    #askpin { font: 20px/1 "Helvetica Neue", Arial, sans-serif; width: 4.2em; text-align: center; letter-spacing: .15em; background: #0b0b0b; color: #fff; border: 1px solid #4aa8ff; border-radius: 5px; padding: 4px; }
    #share button { font: inherit; color: #ddd; background: #222; border: 1px solid #444; border-radius: 5px; padding: 5px 12px; cursor: pointer; margin-top: 8px; }
    #share #donemsg { color: #8dff8d; }
    #share #donemsg.bad { color: #ff8a8a; }
    #share .foot { margin-top: 10px; border-top: 1px solid #262626; padding-top: 4px; }
    #share #newcode { color: #ff8a8a; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="top">
    <select id="model" aria-label="Deck size"><option value="xl">Stream Deck XL</option><option value="mk2">Stream Deck MK.2</option><option value="mini">Stream Deck Mini</option></select>
    <span id="note"></span>
    <button id="more" title="More">⋯</button>
  </div>
  <div id="menu" hidden><button id="m-share">Show on a phone…</button></div>
  <div id="share" hidden><div class="box">
    <h3>This deck on a phone</h3>
    <div id="s-qr"><p>Scan with the phone’s camera. It opens as a <span id="sharesize"></span>, controlling this timer. The code goes as soon as a phone picks it up.</p><div id="qr"></div></div>
    <div id="s-wait" hidden><p id="waitwho"></p><input id="askpin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="###"><br><button id="refuse" title="Not yours? Disconnect it">Refuse</button></div>
    <div id="s-done" hidden><p id="donemsg"></p><button id="revoke" hidden title="Disconnect it and forget it: it would need its number typed again">Revoke</button> <button id="again">Show the code again</button></div>
    <div class="foot"><button id="newcode" title="A new code: every phone, display and Companion connection is signed out, and the code shown before stops working">New code (signs out every device)</button> <button id="shareclose">Done</button></div>
  </div></div>
  <div id="deck"><div id="keys"></div></div>
  <script src="deck-face.js?v=095d2354"></script>
  <script src="virtual-deck.js?v=f112dd1e"></script>
  <script>
  (function () {
    'use strict';
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    let model = VirtualDeck.MODELS[params.get('model')] ? params.get('model') : 'xl';
    const timer = () => { try { const o = window.opener; return o && !o.closed && o.StreamDeck ? o.StreamDeck : null; } catch (_) { return null; } };
    const vd = VirtualDeck.create($('keys'), { onPress: i => { const sd = timer(); if (sd) sd.press(i, model, { editing: true, local: true }); poll(); } });
    let last = [];
    function setModel(m) {
      model = m; $('model').value = m;
      vd.setModel(m); last = [];
      history.replaceState(null, '', location.pathname + '?model=' + m);
      fit(); poll();
    }
    function fit() {
      const d = $('deck'), cs = getComputedStyle(d);
      vd.layout(d.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), d.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom), 0.3);
    }
    function poll() {
      const sd = timer(), note = $('note');
      if (!sd) { note.textContent = 'The timer window is closed: open this again from its deck editor (D).'; note.className = 'gone'; return; }
      const editing = sd.editing();
      note.textContent = editing ? 'Showing the deck editor’s unsaved changes' : '';
      note.className = editing ? 'edit' : '';
      const faces = sd.faces(model, { editing: true, local: true });
      faces.forEach((f, i) => { const j = JSON.stringify(f); if (last[i] !== j) { last[i] = j; vd.setFace(i, f); } });
      vd.setBacklight(sd.brightness);
    }
    $('model').addEventListener('change', e => setModel(e.target.value));

    // ⋯ → Show on a phone: a QR code of a control link that opens the phone in the deck view at this size
    // (remoteControl.linkFor; sharing turned on if it was off). The code is taken off the screen as soon as a
    // phone connects (so someone passing can't pick it up too); its 3-digit number is typed here
    // (remoteControl.approve; the timer's share panel works too) or it's Refused; once in, Revoke throws it
    // out again. New code signs out every device (the code shown before stops working).
    const NAMES = { xl: 'Stream Deck XL', mk2: 'Stream Deck MK.2', mini: 'Stream Deck Mini' };
    const rc = () => { try { return window.opener && !window.opener.closed ? window.opener.remoteControl : null; } catch (_) { return null; } };
    $('more').addEventListener('click', () => { $('menu').hidden = !$('menu').hidden; });
    document.addEventListener('click', e => { if (!e.target.closest('#menu, #more')) $('menu').hidden = true; });
    let stage = null, before = new Set(), who = null, whoToken = null, typed = false, shareTimer = 0;
    const nameOf = e => (e && (e.name || e.suggest)) || 'A phone';
    function drawQR(text) {
      const box = $('qr');
      box.innerHTML = '';
      const go = () => { if (stage !== 'qr') return; try { new QRCode(box, { text, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M }); box.title = text; } catch (_) { box.textContent = text; } };
      if (window.QRCode) return go();
      const sc = document.createElement('script'); sc.src = 'qrcode.min.js'; sc.onload = go; sc.onerror = () => { box.textContent = text; }; document.head.appendChild(sc);
    }
    function show(st) { stage = st; $('s-qr').hidden = st !== 'qr'; $('s-wait').hidden = st !== 'wait'; $('s-done').hidden = st !== 'done'; if (st !== 'qr') { $('qr').innerHTML = ''; $('qr').title = ''; } }
    function finish(text, bad, token) { $('donemsg').textContent = text; $('donemsg').className = bad ? 'bad' : ''; whoToken = token || null; $('revoke').hidden = !token; show('done'); }
    function showCode() {
      const r = rc();
      if (!r) return finish('The timer window is closed.', true);
      if (!r.enabled) r.enable();
      before = new Set(r.peers.keys()); who = null; typed = false;
      $('sharesize').textContent = NAMES[model];
      show('qr');
      drawQR(r.linkFor('control', { m: 'deck', dm: model }));
    }
    function sharePoll() {
      const r = rc();
      if (!r) { if (stage !== 'done') finish('The timer window is closed.', true); return; }
      if (stage === 'qr') {                            // a phone picked the code up: off the screen with it
        const e = [...r.peers.values()].find(x => !before.has(x.id) && !x.rejected);
        if (e) { who = e.id; $('askpin').value = ''; show('wait'); }
      }
      if (stage === 'wait') {
        const e = r.peers.get(who);
        if (!e || e.rejected) return finish(!e ? nameOf(e) + ' went away before it was let in.' : typed ? 'That wasn’t its number: ' + nameOf(e) + ' was disconnected.' : 'Refused: ' + nameOf(e) + ' was disconnected.', true);
        if (e.approved) return finish('Connected: ' + nameOf(e) + '.', false, e.token);
        $('waitwho').textContent = e.pin ? nameOf(e) + ' is connecting: type the number it shows.' : nameOf(e) + ' is connecting…';
        $('askpin').hidden = !e.pin;
        if (e.pin && document.activeElement !== $('askpin')) $('askpin').focus();
      }
    }
    $('m-share').addEventListener('click', () => {
      $('menu').hidden = true;
      $('share').hidden = false;
      showCode();
      clearInterval(shareTimer); shareTimer = setInterval(sharePoll, 300);
    });
    $('askpin').addEventListener('input', e => {
      const v = e.target.value.replace(/\D/g, '').slice(0, 4);
      e.target.value = v;
      const r = rc(), p = r && who && r.peers.get(who);
      if (p && p.pin && v.length === String(p.pin).length) { typed = true; r.approve(who, v); sharePoll(); }
    });
    $('refuse').addEventListener('click', () => { const r = rc(); if (r && who) r.refuse(who); sharePoll(); });
    $('revoke').addEventListener('click', () => {
      const r = rc();
      if (!r || !whoToken) return;
      r.revoke(whoToken);
      finish('Revoked: it was disconnected and forgotten (it would need its number typed again).', true);
    });
    $('again').addEventListener('click', showCode);
    $('newcode').addEventListener('click', () => {
      const r = rc();
      if (!r || !confirm('Make a new code? Every phone, display and Companion connection is signed out, and the code shown before stops working.')) return;
      r.newCode();
      if (stage === 'qr') showCode(); else finish('New code: every device was signed out.', true);
    });
    $('shareclose').addEventListener('click', () => { $('share').hidden = true; clearInterval(shareTimer); stage = null; $('qr').innerHTML = ''; });
    window.addEventListener('resize', fit);
    if (location.hostname) document.title = location.hostname + ' - Virtual Stream Deck';
    setModel(model);
    setInterval(poll, 200);
  })();
  </script>
</body>
</html>
